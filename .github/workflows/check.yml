# PR：ルールで検査し、結果をPRに残す。ルール違反なら失敗する（main の保護で必須チェックにする）
#
# 【デモ2／基準2 セキュリティ】実際の運用では、手元で見せた検査が PR で必ず動く
#   ・PR #1（違反）：この検査が赤くなり、マージできない。
#   ・PR #2（例外）：検査は通るが、「例外あり」のラベルと例外の一覧のコメントが自動で付き、インフラのレビュー待ちになる。
#   ・どちらも、Checks のサマリーにチェックシートの形の表が残る（＝顧客への回答の証跡。スライド30）。
name: check
on: pull_request
permissions:
  id-token: write
  contents: read
  pull-requests: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/gha-check
          aws-region: ap-northeast-1
      # @acme スコープだけを CodeArtifact に向ける
      - run: aws codeartifact login --tool npm --domain acme --repository platform --namespace acme
      - name: 画面をビルド（部品が dist を S3 に置くため）
        run: npm ci && npm run build
        working-directory: app/web
      - run: npm ci
        working-directory: infra
      - name: 型の検査
        run: npx tsc --noEmit
        working-directory: infra
      - name: ルールで検査（違反なら失敗）
        id: synth
        run: |
          set -o pipefail
          npx cdk synth '**' --quiet 2>&1 | tee synth.log   # Stage の中のスタックも含めて全部を検査する
        working-directory: infra
      - name: 検査結果をPRのサマリーに書く
        if: always()
        run: npx acme-checksheet --markdown >> "$GITHUB_STEP_SUMMARY"
        working-directory: infra
      # 検査の結果（全項目の表）を、PR のコメント1つにまとめる。顧客への回答の証跡にもなる
      - name: 検査結果をコメントする
        if: always() && steps.synth.outcome != 'skipped'
        working-directory: infra
        env:
          GH_TOKEN: ${{ github.token }}
          SYNTH: ${{ steps.synth.outcome }}
        run: |
          npx acme-checksheet --exceptions-only --markdown > exceptions.md || true
          npx acme-checksheet --markdown > table.md || true   # 1行目が見出し、そのあとが全項目の表
          {
            head -n 1 table.md
            echo
            if [ "$SYNTH" = failure ]; then
              echo '**❌ 違反があるため、マージできません。** 設定を直すか、理由を書いて `infra/exceptions.ts` に例外を申請してください（インフラのレビューが必要です）。'
              echo
              grep -E '^ERROR Checksheet-' synth.log | sed -E 's/^ERROR Checksheet-[^:]*: /- /; s/ \(Construct Annotations\)$//' | sort -u
            elif [ -s exceptions.md ]; then
              echo '**⚠️ 例外があります。** 理由は表の右端のとおりです。`infra/exceptions.ts` の変更は、インフラチームのレビューが必要です。'
            else
              echo '**✅ すべての項目に準拠しています。**'
            fi
            tail -n +2 table.md
          } > checksheet.md
          ../.github/scripts/upsert-comment.sh ${{ github.event.number }} checksheet checksheet.md
          if [ -s exceptions.md ]; then
            gh pr edit ${{ github.event.number }} --add-label "例外あり"
          fi
      # アプリチームは手元で cdk diff を打たない。マージで開発環境に何が起きるかを PR で確かめられるようにする
      - name: 開発環境との差分をコメントする
        if: success()
        working-directory: infra
        env:
          GH_TOKEN: ${{ github.token }}
          NO_COLOR: '1'
        run: |
          # 読み取り専用のロールで比べられるよう、変更セットは作らずテンプレートどうしで比べる
          npx cdk diff 'Dev/*' --method=template 2>&1 | awk '/^Stack /{p=1} p' | head -c 60000 > diff.txt
          {
            echo '### 開発環境との差分'
            echo
            if grep -q 'Number of stacks with differences: 0' diff.txt; then
              echo 'この PR をマージしても、開発環境のリソースは変わりません。'
            else
              echo 'この PR をマージすると、開発環境（`Dev`）は次のように変わります。`[-]` が今の値、`[+]` がマージ後の値です。'
              echo
              echo '```'
              cat diff.txt
              echo '```'
            fi
          } > diff.md
          ../.github/scripts/upsert-comment.sh ${{ github.event.number }} cdk-diff diff.md
